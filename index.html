<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clientes · Escolha Perfeita</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap');
  :root{
    --tinta:#15241B; --tinta-2:#4C5D51; --tinta-3:#7E8E82;
    --papel:#EDEFEB; --carta:#FFFFFF; --linha:#CFD6C9; --linha-2:#E3E8E0;
    --verde:#1F7A47; --verde-fraco:#E5F1E8;
    --ambar:#9C5A15; --ambar-fraco:#F6EADB;
    --alerta:#A32E2E; --alerta-fraco:#FBEDED;
    --corpo:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --titulo:'IBM Plex Serif',Georgia,serif;
    --raio:4px; --sombra:0 1px 2px rgba(21,36,27,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--papel);color:var(--tinta);font-family:var(--corpo);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,textarea,select{font:inherit;color:inherit}
  h1,h2,h3{font-family:var(--titulo);font-weight:500;letter-spacing:-.01em;margin:0}
  .oculto{display:none !important}
  a{color:inherit}

  /* login */
  .login-tela{position:fixed;inset:0;background:var(--papel);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-caixa{background:var(--carta);border:1px solid var(--linha-2);border-radius:6px;padding:34px 30px;width:100%;max-width:340px;text-align:center;box-shadow:var(--sombra)}
  .login-caixa h1{font-size:21px}
  .login-caixa .sub{margin:4px 0 24px;color:var(--tinta-3);font-size:13px}
  .login-erro{color:var(--alerta);font-size:13px;margin-top:12px}

  .rotulo{font-size:13px;color:var(--tinta-2);display:block;margin:14px 0 5px;font-weight:500;text-align:left}
  .campo{width:100%;border:1px solid var(--linha);border-radius:var(--raio);background:var(--carta);padding:12px 13px;font-size:16px;min-height:48px}
  .campo:focus{outline:2px solid var(--verde);outline-offset:1px}
  textarea.campo{min-height:80px;line-height:1.55;resize:vertical}
  select.campo{min-height:48px}

  /* topo */
  .topo{position:sticky;top:0;z-index:40;background:var(--carta);border-bottom:1px solid var(--linha-2);
    display:flex;align-items:center;gap:14px;padding:10px 16px}
  .topo-marca{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .topo-marca img{height:34px;width:auto;object-fit:contain;flex-shrink:0}
  .topo-marca .divisor{width:1px;height:22px;background:var(--linha);flex-shrink:0}
  .topo-marca .nome-app{font-size:15px;font-weight:500;color:var(--tinta);font-family:var(--titulo);white-space:nowrap}
  @media(max-width:620px){.topo-marca .nome-app{display:none}}
  .topo-titulo{flex:1;min-width:0;font-size:15px;font-weight:500;color:var(--tinta)}
  @media(max-width:620px){.topo-titulo{display:none}}
  .topo-acoes{display:flex;gap:8px;flex-shrink:0}

  /* botões */
  .bt{border:1px solid var(--linha);background:var(--carta);color:var(--tinta);border-radius:var(--raio);
    padding:11px 16px;font-weight:600;font-size:15px;cursor:pointer;min-height:46px;
    display:inline-flex;align-items:center;gap:8px;justify-content:center}
  .bt-forte{background:var(--verde);border-color:var(--verde);color:#fff}
  .bt-escuro{background:var(--papel);border-color:var(--linha);color:var(--tinta-2);padding:8px 13px;min-height:40px;font-size:14px}
  .bt-largo{width:100%}
  .bt:disabled{opacity:.45;cursor:not-allowed}

  .quadro{max-width:1040px;margin:0 auto;padding:20px 16px 96px}

  /* painel de contagem */
  .painel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  @media(max-width:520px){.painel{gap:7px}}
  .painel-item{background:var(--carta);border:1px solid var(--linha-2);border-top:3px solid var(--linha);
    border-radius:5px;padding:12px 14px;text-align:left;cursor:pointer;box-shadow:var(--sombra)}
  .painel-item .n{font-family:var(--titulo);font-size:26px;line-height:1.1}
  .painel-item .r{font-size:12.5px;color:var(--tinta-3);margin-top:2px}
  .painel-item.on{background:var(--papel)}
  .painel-item.vencidos{border-top-color:var(--alerta)} .painel-item.vencidos .n{color:var(--alerta)}
  .painel-item.proximos{border-top-color:var(--ambar)} .painel-item.proximos .n{color:var(--ambar)}
  .painel-item.emdia{border-top-color:var(--verde)} .painel-item.emdia .n{color:var(--verde)}
  @media(max-width:520px){.painel-item{padding:10px}.painel-item .n{font-size:21px}.painel-item .r{font-size:11px}}

  .barra-topo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .barra-topo .busca{flex:1;min-width:180px}
  .abas{display:flex;gap:6px;margin-bottom:16px}
  .aba{border:1px solid var(--linha);background:var(--carta);color:var(--tinta-2);border-radius:var(--raio);
    padding:8px 16px;font-size:14px;font-weight:500;cursor:pointer}
  .aba.on{background:var(--verde);border-color:var(--verde);color:#fff}
  .abas-principais{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--linha-2);padding-bottom:14px}
  .aba-principal{border:1px solid var(--linha);background:var(--carta);color:var(--tinta-2);border-radius:var(--raio);
    padding:10px 18px;font-size:14.5px;font-weight:600;cursor:pointer}
  .aba-principal.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
  .linha-pessoa{display:grid;grid-template-columns:1fr 1fr 42px;gap:8px;margin-bottom:8px}
  @media(max-width:520px){.linha-pessoa{grid-template-columns:1fr 1fr;grid-template-areas:"a b" "c c"}
    .linha-pessoa input:first-child{grid-area:a}.linha-pessoa input:last-child{grid-area:b}.linha-pessoa button{grid-area:c}}
  .chk-indeterminado{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--tinta-2);margin:10px 0 4px;cursor:pointer}
  .chk-indeterminado input{width:auto}
  .contagem{font-size:13px;color:var(--tinta-3);margin:0 0 12px}

  /* cards */
  .cards{display:grid;gap:10px}
  .card-cli{background:var(--carta);border:1px solid var(--linha-2);border-left:4px solid var(--linha);
    border-radius:5px;padding:15px 17px;box-shadow:var(--sombra)}
  .card-cli.urgente{border-left-color:var(--alerta);background:var(--alerta-fraco)}
  .card-cli.proximo{border-left-color:var(--ambar);background:var(--ambar-fraco)}
  .card-topo{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .card-cli h3{font-size:17px;color:var(--tinta);font-weight:600}
  .pagina-cabecalho{margin-bottom:20px}
  .kicker{font-size:12px;font-weight:600;color:var(--verde);letter-spacing:.03em;margin:0 0 6px;
    display:flex;align-items:center;gap:7px}
  .kicker::before{content:"";width:16px;height:1.5px;background:var(--verde);flex-shrink:0}
  .pagina-cabecalho h1{font-size:24px;margin:0;letter-spacing:-.01em}
  .card-cli .imovel{font-size:13.5px;color:var(--tinta-2);margin-top:2px}
  .card-acoes{display:flex;gap:6px;flex-shrink:0}
  .ic{border:1px solid var(--linha);background:var(--carta);border-radius:var(--raio);width:38px;height:38px;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;text-decoration:none;color:var(--tinta-2)}
  .ic:hover{border-color:var(--verde);color:var(--verde)}
  .ultimo-contato{font-size:12.5px;color:var(--tinta-3);margin-top:6px}

  .situacoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  @media(max-width:600px){.situacoes{grid-template-columns:1fr}}
  .situacao{border:1px solid var(--linha-2);border-radius:4px;padding:9px 11px;background:var(--papel)}
  .situacao.ok{background:var(--verde-fraco);border-color:#CFE3D5}
  .situacao.perto{background:var(--ambar-fraco);border-color:#E8D3B4}
  .situacao.vencido{background:var(--alerta-fraco);border-color:#E3C7C7}
  .situacao.resolvido{background:var(--papel);border-color:var(--linha-2);opacity:.75}
  .situacao .rot{font-size:11.5px;color:var(--tinta-3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .situacao .stt{font-size:13.5px;color:var(--tinta-2);margin-top:3px}
  .situacao .prz{font-size:12.5px;margin-top:4px;font-weight:600}
  .situacao.ok .prz{color:var(--verde)}
  .situacao.perto .prz{color:var(--ambar)}
  .situacao.vencido .prz{color:var(--alerta)}
  .situacao.sem-data .prz,.situacao.resolvido .prz{color:var(--tinta-3);font-weight:400}

  .vazio{text-align:center;padding:50px 20px;color:var(--tinta-2);border:1px dashed var(--linha);border-radius:5px}
  .vazio h3{margin-bottom:6px}
  .vazio p{margin:0 0 18px;font-size:14.5px;color:var(--tinta-3)}
  .carregando{text-align:center;padding:60px 20px;color:var(--tinta-3)}

  /* calendário */
  .cal-topo{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}
  .cal-mes{font-family:var(--titulo);font-size:19px;min-width:190px;text-align:center;text-transform:capitalize}
  .cal-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:var(--carta);
    border:1px solid var(--linha-2);border-radius:5px;padding:10px;box-shadow:var(--sombra)}
  .cal-dia-nome{font-size:11.5px;color:var(--tinta-3);text-align:center;font-weight:600;padding:4px 0;text-transform:uppercase}
  .cal-cel{min-height:78px;border:1px solid var(--linha-2);border-radius:4px;padding:5px;background:var(--papel)}
  .cal-cel.fora{background:transparent;border-color:transparent}
  .cal-cel.hoje{border-color:var(--verde);border-width:2px}
  .cal-n{font-size:12px;color:var(--tinta-3);font-weight:600}
  .cal-cel.hoje .cal-n{color:var(--verde)}
  .cal-ev{display:block;width:100%;text-align:left;font-size:10.5px;line-height:1.25;margin-top:3px;padding:3px 4px;
    border-radius:3px;border:0;cursor:pointer;background:var(--verde-fraco);color:var(--verde);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-ev.vencido{background:var(--alerta-fraco);color:var(--alerta)}
  .cal-ev.perto{background:var(--ambar-fraco);color:var(--ambar)}
  @media(max-width:680px){
    .cal-grade{gap:3px;padding:6px}
    .cal-cel{min-height:60px;padding:3px}
    .cal-ev{font-size:9px}
  }

  /* diálogo */
  .dialogo{position:fixed;inset:0;background:rgba(15,24,29,.55);z-index:90;display:flex;align-items:flex-start;
    justify-content:center;padding:18px;overflow:auto}
  .dialogo-caixa{background:var(--carta);border-radius:6px;padding:22px;width:100%;max-width:560px;margin:20px 0}
  .dialogo-caixa h3{font-size:18px;margin-bottom:4px}
  .grade-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grade-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:520px){.grade-2,.grade-3{grid-template-columns:1fr}}
  .bloco-situacao{border:1px solid var(--linha-2);border-radius:5px;padding:13px;margin-top:12px;background:var(--papel)}
  .bloco-situacao.feito{opacity:.7}
  .bloco-situacao-topo{display:flex;gap:8px;align-items:center}
  .bloco-situacao-topo .campo{flex:1;font-weight:500;background:var(--carta)}
  .mini-bt{flex-shrink:0;border:1px solid var(--linha);background:var(--carta);color:var(--tinta-3);
    border-radius:var(--raio);min-width:40px;height:40px;padding:0 9px;font-size:14px;cursor:pointer}
  .mini-bt.on{background:var(--verde);border-color:var(--verde);color:#fff}
  .mini-bt:hover{border-color:var(--verde);color:var(--verde)}
  .mini-bt.on:hover{color:#fff}
  .add-situacao{background:none;border:1px dashed var(--linha);color:var(--tinta-2);border-radius:var(--raio);
    padding:10px;width:100%;font-size:14px;margin-top:12px;cursor:pointer}
  .add-situacao:hover{border-color:var(--verde);color:var(--verde)}
  .secao-form{border-top:1px solid var(--linha-2);margin-top:18px;padding-top:14px}
  .secao-form .tit{font-size:13.5px;font-weight:600;color:var(--tinta-2);margin-bottom:8px}
  .contato-item{display:flex;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--linha-2)}
  .contato-item .d{color:var(--tinta-3);flex-shrink:0;font-variant-numeric:tabular-nums}
  .contato-item .t{flex:1;color:var(--tinta-2)}
  .contato-item .x{border:0;background:none;color:var(--tinta-3);cursor:pointer;font-size:13px}
  .contato-item .x:hover{color:var(--alerta)}
  .msg-erro{color:var(--alerta);font-size:13.5px;margin-top:10px}
  .rodape-dialogo{display:flex;gap:10px;margin-top:20px}
  .rodape-dialogo .bt{flex:1}
  .link-apagar{background:none;border:0;color:var(--alerta);font-size:13.5px;padding:0;margin-top:16px;cursor:pointer;text-decoration:underline}

  @media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div class="login-tela" id="tela-login">
  <div class="login-caixa">
    <h1>Clientes</h1>
    <p class="sub">Escolha Perfeita Negócios Imobiliários</p>
    <span class="rotulo">E-mail</span>
    <input class="campo" type="email" id="login-email" autocomplete="username">
    <span class="rotulo">Senha</span>
    <input class="campo" type="password" id="login-senha" autocomplete="current-password">
    <button class="bt bt-forte bt-largo" id="login-entrar" style="margin-top:18px">Entrar</button>
    <p class="login-erro oculto" id="login-erro">E-mail ou senha não conferem.</p>
  </div>
</div>

/* Consulta o CEP em duas bases públicas (BrasilAPI e, se falhar, ViaCEP).
   Devolve uma linha pronta pra colar no campo de endereço, ou null. */
async function buscarCep(cep){
  var d = String(cep).replace(/\D/g,"");
  if(d.length!==8) return null;
  function comPrazo(url){
    return Promise.race([
      fetch(url),
      new Promise(function(_,rej){ setTimeout(function(){ rej(new Error("demorou")); },6000); })
    ]);
  }
  try{
    var r = await comPrazo("https://brasilapi.com.br/api/cep/v1/"+d);
    if(r.ok){
      var j = await r.json();
      if(j && j.street!==undefined){
        return [j.street, j.neighborhood].filter(Boolean).join(", ") + (j.city?" — "+j.city:"");
      }
    }
  }catch(e){}
  try{
    var r2 = await comPrazo("https://viacep.com.br/ws/"+d+"/json/");
    if(!r2.ok) return null;
    var j2 = await r2.json();
    if(j2.erro) return null;
    return [j2.logradouro, j2.bairro].filter(Boolean).join(", ") + (j2.localidade?" — "+j2.localidade:"");
  }catch(e){ return null; }
}

function icone(caminho, tam){

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function dataBR(iso){
  if(!iso) return "";
  var p = String(iso).split("-");
  return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : iso;
}
function hojeISO(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function diasAte(iso){
  if(!iso) return null;
  var hoje = new Date(); hoje.setHours(0,0,0,0);
  var alvo = new Date(iso+"T00:00:00");
  if(isNaN(alvo)) return null;
  return Math.round((alvo-hoje)/86400000);
}
function avisoDe(s){
  var n = Number(s && s.aviso);
  return (n && n>0) ? n : AVISO_PADRAO;
}
function urgencia(s){
  if(!s) return "sem-data";
  if(s.resolvido) return "resolvido";
  var d = diasAte(s.vencimento);
  if(d==null) return "sem-data";
  if(d<0) return "vencido";
  if(d<=avisoDe(s)) return "perto";
  return "ok";
}
function textoPrazo(s){
  if(s.resolvido) return "Resolvido" + (s.vencimento?" — venceria "+dataBR(s.vencimento):"");
  var d = diasAte(s.vencimento);
  if(d==null) return "Sem data de vencimento";
  if(d<0) return "Venceu há "+Math.abs(d)+" dia"+(Math.abs(d)===1?"":"s")+" — "+dataBR(s.vencimento);
  if(d===0) return "Vence hoje — "+dataBR(s.vencimento);
  return "Vence em "+d+" dia"+(d===1?"":"s")+" — "+dataBR(s.vencimento);
}
/* soma 1 ano a uma data ISO, preservando dia e mês — usado para achar
   a data do próximo reajuste a partir do último (ou do início do contrato) */
function maisUmAno(iso){
  if(!iso) return null;
  var d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return null;
  d.setFullYear(d.getFullYear()+1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function proximoReajuste(loc){
  return maisUmAno(loc.dataUltimoReajuste || loc.dataInicio);
}
function pessoasDe(lista){ return Array.isArray(lista) ? lista : []; }
function nomesDe(lista){
  var ps = pessoasDe(lista).map(function(p){ return p.nome; }).filter(Boolean);
  return ps.length ? ps.join(" e ") : "";
}
function avisoDeLocacao(loc){
  var n = Number(loc && loc.aviso);
  return (n && n>0) ? n : AVISO_PADRAO_LOCACAO;
}
function urgenciaLocacao(loc){
  var pontos = [];
  if(!loc.indeterminado && loc.dataTermino) pontos.push(urgenciaData(loc.dataTermino, avisoDeLocacao(loc)));
  var pr = proximoReajuste(loc);
  if(pr) pontos.push(urgenciaData(pr, avisoDeLocacao(loc)));
  if(pontos.indexOf("vencido")>=0) return "vencido";
  if(pontos.indexOf("perto")>=0) return "perto";
  if(pontos.indexOf("ok")>=0) return "ok";
  return "sem-data";
}
function urgenciaData(iso, dias){
  var d = diasAte(iso);
  if(d==null) return "sem-data";
  if(d<0) return "vencido";
  if(d<=dias) return "perto";
  return "ok";
}
function chaveOrdenacaoLocacao(loc){
  var datas = [];
  if(!loc.indeterminado && loc.dataTermino) datas.push(diasAte(loc.dataTermino));
  var pr = proximoReajuste(loc);
  if(pr) datas.push(diasAte(pr));
  var validas = datas.filter(function(d){ return d!=null; });
  return validas.length ? Math.min.apply(null, validas) : Infinity;
}

// aceita clientes salvos no formato antigo, de duas situações fixas
function situacoesDe(c){
  if(Array.isArray(c.situacoes)) return c.situacoes;
  var lista=[];
  if(c.seguroStatus || c.seguroVencimento) lista.push({nome:"Seguro incêndio", status:c.seguroStatus, vencimento:c.seguroVencimento});
  if(c.renovStatus || c.renovVencimento) lista.push({nome:"Renovação anual", status:c.renovStatus, vencimento:c.renovVencimento});
  return lista;
}
function contatosDe(c){ return Array.isArray(c.contatos) ? c.contatos : []; }
function soDigitos(t){ return String(t||"").replace(/\D/g,""); }
function linkWhats(telefone, nome){
  var d = soDigitos(telefone);
  if(d.length < 10) return null;
  if(d.length <= 11) d = "55"+d;              // sem código do país, assume Brasil
  var msg = encodeURIComponent("Olá "+(nome||"")+", tudo bem? Aqui é da Escolha Perfeita.");
  return "https://wa.me/"+d+"?text="+msg;
}
// pior situação do cliente: vencido > perto > ok
function estadoCliente(c){
  var us = situacoesDe(c).map(urgencia);
  if(us.indexOf("vencido")>=0) return "vencido";
  if(us.indexOf("perto")>=0) return "perto";
  if(us.indexOf("ok")>=0) return "ok";
  return "sem-data";
}
function chaveOrdenacao(c){
  var ds = situacoesDe(c)
    .filter(function(s){ return !s.resolvido; })
    .map(function(s){ return diasAte(s.vencimento); })
    .filter(function(d){ return d!=null; });
  return ds.length ? Math.min.apply(null, ds) : Infinity;
}

function textoPrazoData(iso){
  var d = diasAte(iso);
  if(d==null) return "Sem data";
  if(d<0) return "Venceu há "+Math.abs(d)+" dia"+(Math.abs(d)===1?"":"s")+" — "+dataBR(iso);
  if(d===0) return "Vence hoje — "+dataBR(iso);
  return "Vence em "+d+" dia"+(d===1?"":"s")+" — "+dataBR(iso);
}

/* ---------- calendário do mês ---------- */
function eventosDoMes(ano, mes){
  var eventos={};
  listaClientes.forEach(function(c){
    situacoesDe(c).forEach(function(s){
      if(!s.vencimento || s.resolvido) return;
      var d=new Date(s.vencimento+"T00:00:00");
      if(isNaN(d) || d.getFullYear()!==ano || d.getMonth()!==mes) return;
      var dia=d.getDate();
      (eventos[dia]=eventos[dia]||[]).push({cliente:c, situacao:s});
    });
  });
  return eventos;
}

function renderCalendario(alvo){
  var ano=mesCal.getFullYear(), mes=mesCal.getMonth();
  var eventos=eventosDoMes(ano,mes);
  var primeiro=new Date(ano,mes,1);
  var diasNoMes=new Date(ano,mes+1,0).getDate();
  var deslocamento=primeiro.getDay();
  var hoje=new Date(); hoje.setHours(0,0,0,0);
  var nomeMes=primeiro.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});

  var celulas="";
  DIAS_SEMANA.forEach(function(d){ celulas+='<div class="cal-dia-nome">'+d+'</div>'; });
  for(var i=0;i<deslocamento;i++) celulas+='<div class="cal-cel fora"></div>';

  for(var dia=1; dia<=diasNoMes; dia++){
    var dataDia=new Date(ano,mes,dia);
    var ehHoje = dataDia.getTime()===hoje.getTime();
    var evs=eventos[dia]||[];
    var htmlEv=evs.map(function(ev){
      var u=urgencia(ev.situacao);
      return '<button class="cal-ev '+u+'" data-act="abrir" data-id="'+ev.cliente.id+'" title="'+
        esc(ev.cliente.nome+" — "+(ev.situacao.nome||"Situação"))+'">'+
        esc(ev.cliente.nome)+'</button>';
    }).join('');
    celulas+='<div class="cal-cel'+(ehHoje?' hoje':'')+'"><div class="cal-n">'+dia+'</div>'+htmlEv+'</div>';
  }

  var total=Object.keys(eventos).reduce(function(soma,d){ return soma+eventos[d].length; },0);
  alvo.innerHTML=
    '<div class="cal-topo">'+
      '<button class="bt bt-escuro" data-mes="-1">‹</button>'+
      '<span class="cal-mes">'+esc(nomeMes)+'</span>'+
      '<button class="bt bt-escuro" data-mes="1">›</button>'+
    '</div>'+
    '<p class="contagem">'+(total?total+' vencimento'+(total===1?'':'s')+' neste mês':'Nenhum vencimento neste mês')+'</p>'+
    '<div class="cal-grade">'+celulas+'</div>';
}

      (editando?'<button class="link-apagar" data-apagar="1">Apagar locação</button>':'')+
    '</div>';

  function capturarPessoas(){
    d.querySelectorAll("#lista-locadores .linha-pessoa").forEach(function(linha,i){
      pessoasLocadorForm[i] = { nome: linha.querySelector('[data-pf="nome"]').value, telefone: linha.querySelector('[data-pf="telefone"]').value };
    });
    d.querySelectorAll("#lista-locatarios .linha-pessoa").forEach(function(linha,i){
      pessoasLocatarioForm[i] = { nome: linha.querySelector('[data-pf="nome"]').value, telefone: linha.querySelector('[data-pf="telefone"]').value };
    });
  }

  d.addEventListener("change", function(e){
    if(e.target.id==="check-indeterminado"){
      var campoTermino = d.querySelector("#campo-termino");
      campoTermino.disabled = e.target.checked;
      if(e.target.checked) campoTermino.value="";
    }
  });

  d.addEventListener("input", async function(e){
    if(e.target.id !== "cep-ajuda-loc") return;
    var dig = e.target.value.replace(/\D/g,"").slice(0,8);
    e.target.value = dig.length>5 ? dig.slice(0,2)+"."+dig.slice(2,5)+"-"+dig.slice(5) : dig;
    var dica = d.querySelector("#cep-dica-loc");
    if(dig.length !== 8){ dica.textContent=""; return; }
    dica.textContent = "Buscando…";
    var achado = await buscarCep(dig);
    if(!achado){ dica.textContent="CEP não encontrado. Preenche à mão."; return; }
    var campoImovel = d.querySelector('[data-c="imovel"]');
    if(!campoImovel.value.trim()){
      campoImovel.value = achado;
      dica.textContent = "Preenchi o endereço abaixo — só falta o número.";
    } else {
      dica.textContent = "Achei: "+achado+" (o campo abaixo já tinha algo, não mudei).";
    }
  });

  d.addEventListener("click", async function(e){
    var alvo=e.target;
    if(alvo===d || alvo.dataset.x){ d.remove(); return; }

    if(alvo.dataset.addPessoa!==undefined){
      capturarPessoas();
      if(alvo.dataset.addPessoa==="locador") pessoasLocadorForm.push({nome:"",telefone:""});
      else pessoasLocatarioForm.push({nome:"",telefone:""});
      redesenharPessoas(d); return;
    }
    if(alvo.dataset.removerPessoa!==undefined){
      capturarPessoas();
      var partes = alvo.dataset.removerPessoa.split(":");
      var lista = partes[0]==="locador" ? pessoasLocadorForm : pessoasLocatarioForm;
      if(lista.length>1) lista.splice(Number(partes[1]),1);
      redesenharPessoas(d); return;
    }

    if(alvo.dataset.apagar){
      if(!confirm("Apagar esta locação? Não tem como desfazer.")) return;
      try{ await deleteDoc(doc(db,COL_LOCACOES,loc.id)); d.remove(); }
      catch(err){ erroFormLoc(d, err.message); }
      return;
    }

    if(alvo.dataset.ok){
      capturarPessoas();
      var v={};
      d.querySelectorAll(".dialogo-caixa > [data-c], .secao-form > [data-c]").forEach(function(el){
        v[el.dataset.c]=el.value.trim();
      });
      d.querySelectorAll(".secao-form select[data-c], .secao-form input[data-c]").forEach(function(el){
        v[el.dataset.c]=el.value.trim();
      });

      v.locadores = pessoasLocadorForm.filter(function(p){ return (p.nome||"").trim() || (p.telefone||"").trim(); })
        .map(function(p){ return {nome:(p.nome||"").trim(), telefone:(p.telefone||"").trim()}; });
      v.locatarios = pessoasLocatarioForm.filter(function(p){ return (p.nome||"").trim() || (p.telefone||"").trim(); })
        .map(function(p){ return {nome:(p.nome||"").trim(), telefone:(p.telefone||"").trim()}; });
      v.indeterminado = d.querySelector("#check-indeterminado").checked;
      if(v.indeterminado) v.dataTermino = "";

      if(!v.locadores.length && !v.locatarios.length){
        erroFormLoc(d, "Preenche pelo menos o locador ou o locatário."); return;
      }

      var btn=alvo; btn.disabled=true; btn.textContent="Salvando...";
      try{
        if(editando){
          v.atualizadoEm=serverTimestamp();
          await updateDoc(doc(db,COL_LOCACOES,loc.id), v);
        } else {
          v.criadoEm=serverTimestamp(); v.atualizadoEm=serverTimestamp();
          await addDoc(collection(db,COL_LOCACOES), v);
        }
        d.remove();
      }catch(err){
        erroFormLoc(d, err.message);
        btn.disabled=false; btn.textContent="Salvar";
      }
    }
  });

  document.body.appendChild(d);
  redesenharPessoas(d);
}
function erroFormLoc(d,msg){
  var el=d.querySelector("[data-erro]");
  el.textContent=msg; el.classList.remove("oculto");
}

function abrirFormulario(cliente){
  var editando=!!cliente;
  var c=cliente||{};
  var base=situacoesDe(c);
  situacoesForm = base.length ? base.map(function(s){ return Object.assign({},s); })
    : [{nome:"Seguro incêndio",status:"",vencimento:"",aviso:AVISO_PADRAO},
       {nome:"Renovação anual",status:"",vencimento:"",aviso:AVISO_PADRAO}];
  contatosForm = contatosDe(c).map(function(x){ return Object.assign({},x); });

  var d=document.createElement("div"); d.className="dialogo";
  d.innerHTML=
    '<div class="dialogo-caixa">'+
      '<h3>'+(editando?"Editar cliente":"Novo cliente")+'</h3>'+
      '<span class="rotulo">Nome do cliente</span>'+
      '<input class="campo" data-c="nome" value="'+esc(c.nome)+'" placeholder="Nome completo">'+
      '<div class="grade-2">'+
        '<div><span class="rotulo">Telefone</span><input class="campo" data-c="telefone" value="'+esc(c.telefone)+'" placeholder="71 90000-0000"></div>'+
        '<div><span class="rotulo">CEP (opcional, só pra ajudar a preencher)</span>'+
          '<input class="campo" id="cep-ajuda" placeholder="41.192-065" inputmode="numeric"></div>'+
      '</div>'+
      '<span class="rotulo" id="cep-dica" style="min-height:16px;display:block"></span>'+
      '<span class="rotulo">Imóvel / endereço</span>'+
      '<input class="campo" data-c="imovel" value="'+esc(c.imovel)+'" placeholder="Rua, nº, bairro">'+

      '<div class="secao-form"><div class="tit">Prazos a acompanhar</div>'+
        '<div id="blocos-situacao"></div>'+
        '<button type="button" class="add-situacao" data-add-situacao="1">+ Adicionar situação</button>'+
      '</div>'+

      '<div class="secao-form"><div class="tit">Histórico de contato</div>'+
        '<div id="lista-contatos"></div>'+
        '<div style="display:flex;gap:8px;margin-top:10px">'+
          '<input class="campo" id="novo-contato" placeholder="O que foi conversado hoje">'+
          '<button type="button" class="bt" data-add-contato="1" style="flex-shrink:0">Anotar</button>'+
        '</div>'+
      '</div>'+

      '<div class="secao-form"><div class="tit">Observações</div>'+
        '<textarea class="campo" data-c="observacoes" placeholder="Qualquer detalhe a mais">'+esc(c.observacoes)+'</textarea>'+
      '</div>'+

      '<p class="msg-erro oculto" data-erro></p>'+
      '<div class="rodape-dialogo">'+
        '<button class="bt" data-x="1">Cancelar</button>'+
        '<button class="bt bt-forte" data-ok="1">Salvar</button>'+
      '</div>'+
      (editando?'<button class="link-apagar" data-apagar="1">Apagar cliente</button>':'')+
    '</div>';

  // preserva o que já foi digitado antes de redesenhar os blocos
  function capturar(){
    d.querySelectorAll("#blocos-situacao > .bloco-situacao").forEach(function(bloco,i){
      situacoesForm[i]=Object.assign({}, situacoesForm[i], {
        nome: bloco.querySelector('[data-sf="nome"]').value,
        status: bloco.querySelector('[data-sf="status"]').value,
        vencimento: bloco.querySelector('[data-sf="vencimento"]').value,
        aviso: Number(bloco.querySelector('[data-sf="aviso"]').value)||AVISO_PADRAO
      });
    });
  }

  d.addEventListener("click", async function(e){
    var alvo=e.target;
    if(alvo===d || alvo.dataset.x){ d.remove(); return; }

    if(alvo.dataset.addSituacao!==undefined){
      capturar();
      situacoesForm.push({nome:"",status:"",vencimento:"",aviso:AVISO_PADRAO});
      redesenhar(d); return;
    }
    if(alvo.dataset.remover!==undefined){
      capturar();
      situacoesForm.splice(Number(alvo.dataset.remover),1);
      redesenhar(d); return;
    }
    if(alvo.dataset.resolver!==undefined){
      capturar();
      var i=Number(alvo.dataset.resolver);
      situacoesForm[i].resolvido = !situacoesForm[i].resolvido;
      redesenhar(d); return;
    }
    if(alvo.dataset.addContato!==undefined){
      var inp=d.querySelector("#novo-contato");
      var txt=inp.value.trim();
      if(!txt) return;
      capturar();
      contatosForm.push({data:hojeISO(), texto:txt});
      inp.value="";
      redesenhar(d); return;
    }
    if(alvo.dataset.remContato!==undefined){
      capturar();
      contatosForm.splice(Number(alvo.dataset.remContato),1);
      redesenhar(d); return;
    }

    if(alvo.dataset.apagar){
      if(!confirm("Apagar "+(c.nome||"este cliente")+"? Não tem como desfazer.")) return;
      try{ await deleteDoc(doc(db,COL,c.id)); d.remove(); }
      catch(err){ erroForm(d, err.message); }
      return;
    }

    if(alvo.dataset.ok){
      capturar();
      var v={};
      d.querySelectorAll(".dialogo-caixa > [data-c], .secao-form > [data-c]").forEach(function(el){
        v[el.dataset.c]=el.value.trim();
      });
      if(!v.nome){ erroForm(d,"Dá um nome para o cliente."); return; }

      v.situacoes = situacoesForm.map(function(s){
        return {
          nome:(s.nome||"").trim()||"Situação",
          status:(s.status||"").trim(),
          vencimento:s.vencimento||"",
          aviso:Number(s.aviso)||AVISO_PADRAO,
          resolvido: !!s.resolvido
        };
      }).filter(function(s){ return s.nome!=="Situação" || s.status || s.vencimento; });
      v.contatos = contatosForm;
      // limpa os campos do formato antigo, se o cliente vier de lá
      v.seguroStatus=null; v.seguroVencimento=null; v.renovStatus=null; v.renovVencimento=null;

      var btn=alvo; btn.disabled=true; btn.textContent="Salvando...";
      try{
        if(editando){
          v.atualizadoEm=serverTimestamp();
          await updateDoc(doc(db,COL,c.id), v);
        } else {
          v.criadoEm=serverTimestamp(); v.atualizadoEm=serverTimestamp();
          await addDoc(collection(db,COL), v);
        }
        d.remove();
      }catch(err){
        erroForm(d, err.message);
        btn.disabled=false; btn.textContent="Salvar";
      }
    }
  });

  d.addEventListener("input", async function(e){
    if(e.target.id !== "cep-ajuda") return;
    var dig = e.target.value.replace(/\D/g,"").slice(0,8);
    e.target.value = dig.length>5 ? dig.slice(0,2)+"."+dig.slice(2,5)+"-"+dig.slice(5) : dig;
    var dica = d.querySelector("#cep-dica");
    if(dig.length !== 8){ dica.textContent=""; return; }
    dica.textContent = "Buscando…";
    var achado = await buscarCep(dig);
    if(!achado){ dica.textContent="CEP não encontrado. Preenche o endereço à mão."; return; }
    var campoImovel = d.querySelector('[data-c="imovel"]');
    if(!campoImovel.value.trim()){
      campoImovel.value = achado;
      dica.textContent = "Preenchi o endereço abaixo — só falta o número.";
    } else {
      dica.textContent = "Achei: "+achado+" (o campo abaixo já tinha algo, não mudei).";
    }
  });

  d.addEventListener("keydown", function(e){
    if(e.key==="Enter" && e.target.id==="novo-contato"){
      e.preventDefault();
      d.querySelector("[data-add-contato]").click();
    }
  });

  document.body.appendChild(d);
  redesenhar(d);
  var p=d.querySelector("[data-c]"); if(p) p.focus();
}
function erroForm(d,msg){
  var el=d.querySelector("[data-erro]");
  el.textContent=msg; el.classList.remove("oculto");
}

/* ============ eventos globais ============ */
document.addEventListener("click", function(e){
  if(e.target.closest(".dialogo")) return;   // o diálogo cuida dos próprios cliques

  var elAbaPrincipal=e.target.closest("[data-aba-principal]");
  if(elAbaPrincipal){ abaPrincipal=elAbaPrincipal.dataset.abaPrincipal; marcarAbaPrincipal(); return; }

  var elFiltro=e.target.closest("[data-filtro]");
  if(elFiltro){
    var novo=elFiltro.dataset.filtro;
    filtro = (filtro===novo && novo!=="todos") ? "todos" : novo;  // clicar de novo desmarca
    renderPainel(); renderConteudo();
    return;
  }
  var elFiltroLoc=e.target.closest("[data-filtro-loc]");
  if(elFiltroLoc){
    var novoLoc=elFiltroLoc.dataset.filtroLoc;
    filtroLoc = (filtroLoc===novoLoc && novoLoc!=="todos") ? "todos" : novoLoc;
    renderPainelLoc(); renderConteudoLoc();
    return;
  }
  var elAba=e.target.closest("[data-aba]");
  if(elAba){ aba=elAba.dataset.aba; marcarAba(); renderConteudo(); return; }

  var elMes=e.target.closest("[data-mes]");
  if(elMes){ mesCal.setMonth(mesCal.getMonth()+Number(elMes.dataset.mes)); renderConteudo(); return; }

  var elAct=e.target.closest("[data-act]");
  if(!elAct) return;
  if(elAct.dataset.act==="novo") return abrirFormulario(null);
  if(elAct.dataset.act==="abrir"){
    var c=listaClientes.find(function(x){ return x.id===elAct.dataset.id; });
    if(c) abrirFormulario(c);
  }
  if(elAct.dataset.act==="novo-loc") return abrirFormularioLocacao(null);
  if(elAct.dataset.act==="abrir-loc"){
    var l=listaLocacoes.find(function(x){ return x.id===elAct.dataset.id; });
    if(l) abrirFormularioLocacao(l);
  }
});

document.addEventListener("input", function(e){
  if(e.target.id==="busca"){ busca=e.target.value; renderConteudo(); }
  if(e.target.id==="busca-loc"){ buscaLoc=e.target.value; renderConteudoLoc(); }
});
</script>
